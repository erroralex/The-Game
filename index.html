<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duke's Debug Dash</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Duke&apos;s Debug Dash</h1>
    <div class="stage">
      <canvas id="game" width="400" height="600" aria-label="Duke's Debug Dash game canvas"></canvas>
      <div id="overlay" class="overlay">
        <div class="panel">
          <p id="overlay-title">Duke&apos;s Debug Dash</p>
          <p id="overlay-message">
            Dodge the stack traces. Collect the bugs.<br />
            <kbd>Space</kbd> / tap to flap. <kbd>Shift</kbd> / second tap to dash
            toward the nearest bug.
          </p>
          <button id="start-button" type="button">Start</button>
        </div>
      </div>
    </div>
    <p class="hint">Space or click: flap &middot; Shift or right-click: dash toward the nearest bug (limited charges)</p>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
