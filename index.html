<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duke's Debug Dash</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Duke&apos;s Debug Dash</h1>
    <div class="stage">
      <canvas id="game" width="400" height="600" aria-label="Duke's Debug Dash game canvas"></canvas>
      <div id="narrator" class="narrator">
        <canvas id="narrator-canvas" class="narrator-canvas" width="280" height="472" aria-hidden="true"></canvas>
        <div class="speech-bubble">
          <p id="narrator-text">
            Duke's shipping code again. Dodge the stack traces, dash to grab the
            bugs, and see how high you can score!
          </p>
        </div>
      </div>
      <button id="mute-button" class="mute-button" type="button" aria-label="Toggle music" title="Toggle music (M)">🔊</button>
      <div id="overlay" class="overlay">
        <div class="panel">
          <button id="start-button" type="button">Start</button>
        </div>
      </div>
    </div>
    <p class="hint">Space or click: flap &middot; Shift or right-click: dash &middot; M: mute music</p>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
